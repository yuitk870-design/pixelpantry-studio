name: Daily LootDrop short
on:
  schedule:
    - cron: "37 9 * * *"   # every day 09:37 UTC (18:37 KST), ~2.5h before the 21:00 KST upload slot
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-media
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow numpy scipy requests
      - name: Render today's short
        run: python scripts/daily_short.py
      - name: Save results to the repo
        run: |
          git config user.name "pixelpantry-bot"
          git config user.email "pixelpantry-bot@users.noreply.github.com"
          git add docs
          git commit -m "daily short $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
