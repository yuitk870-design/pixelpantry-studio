name: Import live website
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current LootDrop site from Netlify
        run: |
          set -e
          mkdir -p site/media
          B=https://lootdrop-deals.netlify.app
          for f in index.html og-image.png robots.txt sitemap.xml media/pixelpantry_intro.mp4 media/lootdrop_promo.mp4; do
            curl -fsSL "$B/$f" -o "site/$f"
          done
          ls -la site site/media
      - name: Commit
        run: |
          git config user.name "pixelpantry-bot"
          git config user.email "pixelpantry-bot@users.noreply.github.com"
          git add site
          git commit -m "Import LootDrop website from Netlify" || echo "nothing to commit"
          git push
