name: Weekly LootDrop shorts
on:
  schedule:
    - cron: "17 20 * * 2"   # Tuesday 20:17 UTC (Vancouver early afternoon), before the weekly review
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: weekly-shorts
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow numpy scipy requests
      - name: Render this week's shorts
        run: python scripts/weekly_shorts.py
      - name: Save results to the repo
        run: |
          git config user.name "pixelpantry-bot"
          git config user.email "pixelpantry-bot@users.noreply.github.com"
          git add docs
          git commit -m "weekly shorts $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
