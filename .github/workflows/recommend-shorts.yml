name: Weekly recommended games short
on:
  schedule:
    - cron: "23 20 * * 5"   # Friday 20:23 UTC = Saturday 05:23 KST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: recommend-shorts
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow numpy scipy requests edge-tts
      - name: Render this week's recommendation short
        run: python scripts/recommend_shorts.py
      - name: Save results to the repo
        run: |
          git config user.name "pixelpantry-bot"
          git config user.email "pixelpantry-bot@users.noreply.github.com"
          git add docs
          git commit -m "recommend short $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Upload to YouTube (scheduled 18:00 KST)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          D=$(python -c "import json;print(json.load(open('docs/recommend/latest.json'))['date'])")
          python scripts/yt_upload.py --file "docs/recommend/$D.mp4" \
            --title-file docs/recommend/latest_title.txt --desc-file docs/recommend/latest_caption.txt \
            --tags "스팀할인,스팀세일,게임할인,스팀특가,스팀게임추천,픽셀팬트리" \
            --publish-at "${D}T18:00:00+09:00"
