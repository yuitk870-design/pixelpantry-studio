name: Daily game pages
on:
  schedule:
    - cron: "23 18 * * *"   # daily 18:23 UTC (KST 03:23)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Build game pages, sale page and sitemap
        run: python scripts/build_pages.py
      - name: Save to repo (Netlify deploys automatically)
        run: |
          git config user.name "pixelpantry-bot"
          git config user.email "pixelpantry-bot@users.noreply.github.com"
          git add site
          git commit -m "daily game pages $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
